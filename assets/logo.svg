<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Outsourcing Studio logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#000000" opacity="0.06"/>

  <!-- connecting lines: a central hub with 6 role satellites -->
  <g stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="120"/>
    <line x1="256" y1="256" x2="374" y2="188"/>
    <line x1="256" y1="256" x2="374" y2="324"/>
    <line x1="256" y1="256" x2="256" y2="392"/>
    <line x1="256" y1="256" x2="138" y2="324"/>
    <line x1="256" y1="256" x2="138" y2="188"/>
  </g>

  <!-- central hub (the studio / CEO) -->
  <circle cx="256" cy="256" r="46" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#4F46E5" stroke-opacity="0.25" stroke-width="4"/>

  <!-- 6 role satellites -->
  <g fill="url(#node)">
    <circle cx="256" cy="120" r="26"/>
    <circle cx="374" cy="188" r="26"/>
    <circle cx="374" cy="324" r="26"/>
    <circle cx="256" cy="392" r="26"/>
    <circle cx="138" cy="324" r="26"/>
    <circle cx="138" cy="188" r="26"/>
  </g>
</svg>
