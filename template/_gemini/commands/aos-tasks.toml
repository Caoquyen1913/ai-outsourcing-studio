description = "Show the task board and recent sync log for the active project"

prompt = """
Show the live task board for the active project. Optional args: {{args}}

1. Read .company/state.json. If `active_project` is null, tell the user there's no active project and stop.
2. Run `node scripts/task.mjs render <slug>` to refresh TASKBOARD.md.
3. Read and print .company/projects/<slug>/TASKBOARD.md verbatim.
4. If the user passed filter args, also run `node scripts/task.mjs list <slug> {{args}}` and print the filtered list under a `## Filtered` heading.
5. Read the last 10 lines of .company/projects/<slug>/SYNC.md (if it exists) and print under `## Recent sync`.
6. Do nothing else — no analysis, no edits.
"""
