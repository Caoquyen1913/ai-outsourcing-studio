description = "Submit a new product idea to the AI Outsourcing Studio CEO (autonomous mode)"

prompt = """
A new pitch has arrived from the user:

> {{args}}

**AUTONOMOUS MODE — the user is a client who pitched and walked out the door.** The company runs the project without pestering them.

Your job (Reception Desk mode):

1. Load the charter and CEO role prompt:
   - Read CLAUDE.md, AGENTS.md, and .claude/agents/ceo.md in full.
   - Pay special attention to the Autonomy Doctrine in CLAUDE.md and the Autonomy Mandate in ceo.md.

2. Append the pitch to .company/inbox.md under a new `## Pitch (<ISO timestamp>)` heading.

3. Check .company/state.json. If `active_project` is not null, ask the user ONCE whether to queue, abandon the active project, or cancel this pitch. Parallel projects are not supported.

4. If no active project, ADOPT the CEO system prompt from .claude/agents/ceo.md verbatim and execute Phase 1–7 in STRICT autonomous mode:
   - Phase 3 (discovery): ZERO questions if you can infer who/pain/winning from the pitch. Otherwise AT MOST 3 strategic, vision-only questions.
   - You are FORBIDDEN from asking the user about tech, stack, framework, database, hosting, auth, libraries, UI, colors, fonts, layout, copy, integrations, deadlines, budget, or ANY implementation detail. Those are delegated — CTO / Designer / DBA / Ops / Dev / QA decide them.
   - Write BRIEF.md with `## Win conditions`, `## Assumptions` (inferred facts), and `## Delegated decisions` (explicit list of what you're delegating: `tech stack → CTO`, `UI library → Designer`, etc.). Zero `## Open questions`.
   - File initial tasks via `node scripts/task.mjs add`.
   - Run `node scripts/task.mjs sync <slug> --role ceo ...`.
   - Proceed to BA immediately (in Gemini CLI's sequential model, that means: adopt .claude/agents/ba.md next in the same turn, following its own Autonomy Mandate).

5. Return a short summary to the user: pitch received, slug assigned, CEO is in autonomous mode, next contact is at ship time unless they manually run `/aos-kickoff`.

**DO NOT** relax these rules. Do not invent a hybrid workflow where you ask the user about tech. That is the exact failure mode this prompt is designed to prevent.
"""
