description = "Finalize and ship the active project"

prompt = """
Run the end-of-project ship sequence.

1. Read .company/state.json. If `active_project` is null, stop and tell the user.
2. Verify pre-conditions:
   - `artifacts.CODE === true`
   - Latest REVIEWS/cto-*.md has verdict `approve`
   - Latest REVIEWS/qa-*.md has verdict `pass`
   - `node scripts/task.mjs list <slug> --type bug --status open` returns zero rows
   - `node scripts/task.mjs list <slug> --type bug --status in_review` returns zero rows
   If any precondition fails, print what's missing and stop. Do NOT proceed.
3. Adopt Ops (load .claude/agents/ops.md). Fill every TBD in RUNBOOK.md. Ensure CI green on a clean clone. Package a release artifact. Run the debate skill with devils-advocate on RUNBOOK.md. Sync.
4. Adopt QA (load .claude/agents/qa.md). Run the full suite including any slow/e2e tier. Confirm the coverage matrix is 100% pass. Run the debate skill with devils-advocate on the coverage matrix. Sync.
5. Adopt CEO (load .claude/agents/ceo.md). Verify EVERY `## Win conditions` entry in BRIEF.md is demonstrably met — write REVIEWS/ceo-ship.md with one bullet per win condition citing evidence. Verify success criteria. Confirm zero open or in_review bugs. Flip state.json.status to SHIPPED. Sync.
6. Return a ≤100-word release note to the user, including the path deliverables/<slug>/.
"""
